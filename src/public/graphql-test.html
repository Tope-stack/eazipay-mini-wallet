<!DOCTYPE html>
<html>
<head>
    <title>Eazipay Wallet API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; cursor: pointer; }
        .response { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Mini Wallet API Tester</h1>
    
    <h3>1. Register User</h3>
    <input type="email" id="registerEmail" placeholder="Email">
    <input type="password" id="registerPassword" placeholder="Password">
    <button onclick="register()">Register</button>
    
    <h3>2. Login</h3>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
    
    <h3>Auth Token</h3>
    <input type="text" id="authToken" placeholder="Token will appear here after login">
    
    <h3>3. Create Wallet</h3>
    <button onclick="createWallet()">Create Wallet</button>
    
    <h3>4. Get My Wallets</h3>
    <button onclick="getWallets()">Get My Wallets</button>
    
    <h3>Response</h3>
    <div class="response" id="response">Response will appear here...</div>

    <script>
        const API_URL = window.location.origin + '/graphql';

        async function graphqlRequest(query, variables = {}) {
            const token = document.getElementById('authToken').value;
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify({ query, variables })
            });

            const result = await response.json();
            document.getElementById('response').innerText = JSON.stringify(result, null, 2);
            return result;
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const query = `
                mutation {
                    register(email: "${email}", password: "${password}") {
                        token
                        user { id email }
                    }
                }
            `;
            const result = await graphqlRequest(query);
            if (result.data?.register?.token) {
                document.getElementById('authToken').value = result.data.register.token;
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const query = `
                mutation {
                    login(email: "${email}", password: "${password}") {
                        token
                        user { id email }
                    }
                }
            `;
            const result = await graphqlRequest(query);
            if (result.data?.login?.token) {
                document.getElementById('authToken').value = result.data.login.token;
            }
        }

        async function createWallet() {
            const query = `
                mutation {
                    createWallet {
                        id
                        address
                        createdAt
                    }
                }
            `;
            await graphqlRequest(query);
        }

        async function getWallets() {
            const query = `
                query {
                    getMyWallets {
                        id
                        address
                        createdAt
                    }
                }
            `;
            await graphqlRequest(query);
        }
    </script>
</body>
</html>
