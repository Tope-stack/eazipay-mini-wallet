name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      env:
        JWT_SECRET: test-jwt-secret-for-ci
        ENCRYPTION_KEY: test-encryption-key-32-chars!!
        NODE_ENV: test

    - name: Check coverage thresholds
      run: |
        echo "Coverage report generated"
        cat coverage/coverage-summary.json || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        flags: unittests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify server file
      run: node --check src/server.js

    - name: Check for syntax errors
      run: |
        for file in $(find src -name "*.js"); do
          node --check "$file" || exit 1
        done

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Trigger Render Deployment
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "Warning: RENDER_DEPLOY_HOOK not set. Skipping deployment."
          exit 0
        fi
        
        echo "Triggering Render deployment..."
        response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
        
        if [ "$response" = "200" ] || [ "$response" = "201" ]; then
          echo "Deployment triggered successfully!"
        else
          echo "Deployment trigger failed with status: $response"
          exit 1
        fi

    - name: Deployment notification
      if: success()
      run: |
        echo "✅ Deployment to Render initiated successfully"
        echo "🚀 Visit: https://eazipay-mini-wallet.onrender.com/test"