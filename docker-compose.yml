version: '3.8'

services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: wallet_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/wallet_db
      NODE_ENV: development
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data: